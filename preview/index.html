<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aladdin OS Preview</title><style>
body{margin:0;background:#07111f;color:#eef6ff;font-family:Tahoma,Arial}*{box-sizing:border-box}.app{display:flex;min-height:100vh}.side{width:235px;background:#06101c;border-left:1px solid #19324b;padding:18px;position:sticky;top:0;height:100vh}.brand{font-weight:800;font-size:18px;margin-bottom:22px}.orb{width:34px;height:34px;border-radius:10px;display:inline-block;vertical-align:middle;margin-left:8px;background:linear-gradient(135deg,#24d9ff,#8d68ff);box-shadow:0 0 25px #24d9ff55}.nav button{display:block;width:100%;margin:6px 0;padding:11px;border-radius:10px;border:1px solid transparent;background:transparent;color:#abc0d8;text-align:right;cursor:pointer}.nav button.active,.nav button:hover{background:#0c1c2d;border-color:#193b59;color:#fff}.main{flex:1;padding:22px;max-width:1450px;margin:auto}.top{display:flex;gap:10px;margin-bottom:20px}.search{flex:1;background:#0b1828;border:1px solid #1a3550;border-radius:11px;padding:12px;color:white}.user{background:#0b1828;border:1px solid #1a3550;border-radius:11px;padding:12px}.hero{display:flex;justify-content:space-between;gap:15px;align-items:end;margin-bottom:15px}.hero h1{margin:0;font-size:27px}.muted{color:#86a0bc;font-size:11px}.btn{background:#0b1a2c;color:#eef6ff;border:1px solid #1b3a57;border-radius:9px;padding:10px 12px;cursor:pointer}.primary{background:linear-gradient(135deg,#18c9ed25,#8d68ff25);border-color:#2cd9ff66}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:#0b1727;border:1px solid #18324d;border-radius:14px;padding:14px;box-shadow:0 15px 40px #0003}.kpi .label{color:#86a0bc;font-size:11px}.kpi .num{font-size:25px;font-weight:800;margin:7px 0}.green{color:#45e6a4}.section{margin-top:13px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.sectionhead h3{font-size:14px;margin:0}.agents,.arms{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.agent{min-height:83px}.row{display:flex;justify-content:space-between;gap:8px}.pill{font-size:9px;border:1px solid #29445f;border-radius:20px;padding:4px 7px;color:#a9c9e6}.panels{display:grid;grid-template-columns:1.35fr 1fr;gap:10px}.item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid #15304a;font-size:12px}.item:first-child{border-top:0}.chart{height:145px;display:flex;align-items:end;gap:6px}.bar{flex:1;background:linear-gradient(180deg,#27dcff,#715aff);border-radius:6px 6px 1px 1px}.footer{text-align:center;color:#617e9e;font-size:10px;padding:20px}.toast{position:fixed;bottom:18px;left:18px;background:#0c2034;border:1px solid #28516f;padding:10px 13px;border-radius:9px;display:none;font-size:11px}@media(max-width:1050px){.grid,.agents,.arms{grid-template-columns:repeat(2,1fr)}.panels{grid-template-columns:1fr}}@media(max-width:700px){.app{display:block}.side{width:auto;height:auto;position:relative}.grid,.agents,.arms{grid-template-columns:1fr}.hero{display:block}.actions{margin-top:10px}.user{display:none}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><span class="orb"></span>ALADDIN OS<div class="muted" style="margin:6px 0 0 44px">Central Risk & Operations Engine</div></div><div class="nav" id="nav"><button class="active" data-v="dashboard">⌂ داشبورد</button><button data-v="agents">◈ Agent Grid</button><button data-v="arms">◉ Business Arms</button><button data-v="crm">◎ CRM</button><button data-v="finance">₿ Finance</button><button data-v="tasks">✓ Tasks</button><button data-v="activity">◴ Activity</button><button data-v="security">◉ Security</button></div><div class="card" style="margin-top:18px"><span class="green">●</span> Core Online<div class="muted" style="margin-top:6px">Preview Mode · DB Safe</div></div></aside><main class="main"><div class="top"><input class="search" placeholder="جستجو در Agents، مشتریان، Workflowها..." oninput="showToast('Search: '+this.value)"><div class="user">EH · Owner Console</div></div><div id="c"></div><div class="footer">ALADDIN OS · Interactive Preview · داده‌ها نمایشی هستند و DB اصلی را تغییر نمی‌دهند</div></main></div><div id="toast" class="toast"></div><script>

function showToast(t){var x=document.getElementById('toast');if(!t)return;x.innerText=t;x.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(function(){x.style.display='none'},1200)}
function dashboard(){var h='<div class="hero"><div><h1>مرکز فرماندهی علاالدین</h1><div class="muted">یک نمای زنده از وضعیت عملیاتی اکوسیستم</div></div><div><button class="btn primary" onclick="showToast(\'Workflow جدید ساخته شد\')">+ Workflow جدید</button> <button class="btn" onclick="showToast(\'Agent Grid refreshed\')">Refresh</button></div></div><div class="grid">';[['Net Revenue','$284.8K','+18.4%'],['Active Leads','1,842','+12.1%'],['Open Tasks','67','-9.3%'],['Automation Rate','91.7%','+4.8%']].forEach(function(x){h+='<div class="card kpi"><div class="label">'+x[0]+'</div><div class="num">'+x[1]+'</div><div class="green">'+x[2]+' vs period</div></div>'});h+='</div><div class="section panels"><div class="card"><div class="sectionhead"><h3>Agent Grid</h3><span class="muted">8 nodes</span></div><div class="agents">';data.agents.slice(0,4).forEach(function(a){h+='<div class="card agent"><div class="row"><b>'+a[0]+'</b><span class="pill">'+a[2]+'</span></div><div class="muted" style="margin-top:8px">'+a[1]+'</div></div>'});h+='</div></div><div class="card"><div class="sectionhead"><h3>System Activity</h3><span class="muted">live preview</span></div>';data.activity.forEach(function(a){h+='<div class="item"><span><b>'+a[1]+'</b><div class="muted">'+a[2]+'</div></span><span class="pill">'+a[0]+'</span></div>'});h+='</div></div><div class="section"><div class="sectionhead"><h3>Business Arms</h3><span class="muted">cross-business overview</span></div><div class="arms">';data.arms.forEach(function(a){h+='<div class="card"><b>'+a[0]+'</b><div style="font-size:20px;font-weight:800;margin:7px 0">'+a[1]+'</div><div class="muted">'+a[2]+'</div></div>'});h+='</div></div><div class="section panels"><div class="card"><div class="sectionhead"><h3>Revenue Flow</h3></div><div class="chart">';[50,65,55,75,88,70,103,120,94,132,126,145].forEach(function(v){h+='<div class="bar" style="height:'+v+'px"></div>'});h+='</div></div><div class="card"><div class="sectionhead"><h3>Quick Actions</h3></div>';['Run lead discovery','Start security scan','Reconcile payments','Queue creative QC'].forEach(function(x){h+='<div class="item"><span>'+x+'</span><button class="btn" onclick="showToast(\''+x+' · simulated\')">Run</button></div>'});h+='</div></div>';document.getElementById('c').innerHTML=h}
function list(v,title){var h='<div class="hero"><div><h1>'+title+'</h1><div class="muted">Operational preview · داده‌های نمایشی</div></div><button class="btn primary" onclick="showToast(\'Action simulated safely\')">Action</button></div>';if(v==='agents'){h+='<div class="agents">';data[v].forEach(function(a){h+='<div class="card agent"><div class="row"><b>'+a[0]+'</b><span class="pill">'+a[2]+'</span></div><div class="muted" style="margin-top:8px">'+a[1]+'</div></div>'});h+='</div>'}else{h+='<div class="card">';data[v].forEach(function(a){h+='<div class="item"><span><b>'+a[0]+'</b><div class="muted">'+a[1]+'</div></span><span class="pill">'+(a[2]||'')+' '+(a[3]||'')+'</span></div>'});h+='</div>'}document.getElementById('c').innerHTML=h}
var titles={agents:'Agent Grid',arms:'Business Arms',crm:'CRM / Leads',finance:'Finance & Ledger',tasks:'Tasks & Workflows',activity:'Activity Log',security:'Security Center'};document.querySelectorAll('#nav button').forEach(function(b){b.onclick=function(){document.querySelectorAll('#nav button').forEach(function(z){z.classList.remove('active')});b.classList.add('active');var v=b.getAttribute('data-v');if(v==='dashboard')dashboard();else list(v,titles[v])}});dashboard();
</script></body></html>
